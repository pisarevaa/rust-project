[package]
name = "smart-home"
version = "0.1.0"
edition = "2021"
# Бинарников несколько, поэтому `cargo run` без аргументов запускает пример из ДЗ1-2.
default-run = "smart-home"

[lib]
name = "smart_home"
path = "src/lib.rs"

[[bin]]
name = "smart-home"
path = "src/main.rs"

[lints]
workspace = true

[workspace]
members = [
    ".",
    "crates/smart-socket-ffi",
    "crates/socket-static-app",
    "crates/socket-dynamic-app",
]
# Без этого команды в корне затрагивали бы только пакет smart-home.
default-members = [
    ".",
    "crates/smart-socket-ffi",
    "crates/socket-static-app",
    "crates/socket-dynamic-app",
]
resolver = "2"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
